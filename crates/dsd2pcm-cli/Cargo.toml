[package]
name = "dsd2pcm-cli"
description = "Command-line DSD to PCM converter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
readme.workspace = true
documentation = "https://github.com/aclater/dsd2pcm-rs#readme"
keywords = ["dsd", "pcm", "audio", "converter", "dsf"]
categories = ["multimedia::audio", "command-line-utilities"]

[[bin]]
name = "dsd2pcm"
path = "src/main.rs"
# Its docs would overwrite the library's (both are named dsd2pcm).
doc = false

[dependencies]
dsd2pcm.workspace = true

[features]
default = ["flac"]
flac = ["dsd2pcm/flac"]
