[package]
name = "dsd2pcm-capi"
description = "C interface to dsd2pcm: DSD to PCM conversion"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Not published for 0.1.0: the C library ships as build artefacts.
publish = false
build = "build.rs"

[lib]
name = "dsd2pcm"
crate-type = ["cdylib", "staticlib"]
# Same name as the Rust library: rustdoc would write both to one place. The C API is
# documented in docs/c-api.md and the header.
doc = false

[dependencies]
dsd2pcm.workspace = true

[features]
default = ["flac"]
flac = ["dsd2pcm/flac"]
