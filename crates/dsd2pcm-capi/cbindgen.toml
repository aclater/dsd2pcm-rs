# Generates include/dsd2pcm.h; check.sh fails if the committed header is out of date.
# cbindgen --config cbindgen.toml --crate dsd2pcm-capi --output include/dsd2pcm.h
language = "C"
header = """/* SPDX-License-Identifier: MIT OR Apache-2.0 */
/* dsd2pcm C interface. Generated by cbindgen from crates/dsd2pcm-capi; do not edit. */"""
include_guard = "DSD2PCM_H"
cpp_compat = true
style = "both"
documentation_style = "c99"
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
after_includes = ""

[export]
exclude = []

[enum]
prefix_with_name = true
