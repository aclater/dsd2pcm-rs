# Fuzzing the DSF, DFF and WAV readers (fuzz/, cargo-fuzz): 60 s per target on every pull
# request and push to main, 10 minutes per target every week (.github/scripts/fuzz-smoke.sh).
# Passes with a notice while fuzz/ does not exist. A crash's input is uploaded as an artifact.
name: fuzz

on:
  pull_request:
    paths-ignore: ["**.md"]
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"  # Tuesdays, 04:41 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a new push supersedes the old PR run; main runs finish

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_NIGHTLY: nightly-2026-11-01  # cargo-fuzz's sanitizers need a nightly
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 90 || 30 }}
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest.
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
    defaults:
      run:
        shell: bash
    steps:
      - name: Packages
        run: dnf -y -q --setopt=install_weak_deps=False install git-core gcc gcc-c++ && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (.github/scripts/rust-setup.sh)
        if: hashFiles('fuzz/Cargo.toml') != ''
        run: .github/scripts/rust-setup.sh "$RUST_NIGHTLY"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        if: hashFiles('fuzz/Cargo.toml') != ''
        with:
          workspaces: fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}  # PRs read main's cache, only main writes it
          prefix-key: v0-rust-ubi10-fuzz
      - name: cargo-fuzz (pinned version, its own lock file)
        if: hashFiles('fuzz/Cargo.toml') != ''
        run: cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      - name: Every target
        env:
          SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && 600 || 60 }}
        run: .github/scripts/fuzz-smoke.sh "$SECONDS_PER_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 30
