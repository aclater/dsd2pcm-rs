# The minimum supported Rust version, read from rust-version in the workspace's Cargo.toml,
# still builds every crate's library and binaries: what a user of the crates compiles. Not the
# tests: a dev-dependency (scarletbook-pcm, edition 2024) needs Rust 1.85.
name: msrv

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a new push supersedes the old PR run; main runs finish

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest.
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
    defaults:
      run:
        shell: bash
    steps:
      - name: Packages
        run: dnf -y -q --setopt=install_weak_deps=False install git-core gcc && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: rust-version from Cargo.toml
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml)
          [[ "$msrv" =~ ^1\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          echo "MSRV: $msrv"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
      - name: Rust (.github/scripts/rust-setup.sh)
        env:
          MSRV: ${{ steps.msrv.outputs.msrv }}
        run: .github/scripts/rust-setup.sh "$MSRV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}  # PRs read main's cache, only main writes it
          prefix-key: v0-rust-ubi10-msrv
      - run: cargo check --workspace --locked
      - run: cargo build --workspace --locked --release
