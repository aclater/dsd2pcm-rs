# CI: formatting, clippy, the docs, and the tests on Linux (x86_64, aarch64, i686), macOS
# (arm64) and Windows (x86_64), each test run once per SIMD level the CPU has
# (.github/scripts/test-simd-levels.sh), a short soak test on Linux (tests/soak.rs), and the
# C library's header and C tests, also under AddressSanitizer and LeakSanitizer. MSRV,
# cargo-deny, fuzzing, zizmor, Miri and ThreadSanitizer (sanitizers.yml) have their own
# workflows.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a new push supersedes the old PR run; main runs finish

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.100.0
  # Tests are built optimised, with debug assertions and overflow checks kept on: the
  # identity tests convert seconds of audio, which unoptimised takes many minutes per level.
  CARGO_PROFILE_DEV_OPT_LEVEL: "2"
  CBINDGEN_VERSION: 0.29.4

jobs:
  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-24.04
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest.
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
    defaults:
      run:
        shell: bash
    steps:
      - name: Packages
        run: dnf -y -q --setopt=install_weak_deps=False install git-core gcc && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (.github/scripts/rust-setup.sh)
        run: .github/scripts/rust-setup.sh "$RUST_STABLE" rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}  # PRs read main's cache, only main writes it
          prefix-key: v0-rust-ubi10
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Docs, every warning (rustdoc's and cargo's) an error
        run: |
          cargo doc --workspace --no-deps --locked 2>&1 | tee "$RUNNER_TEMP/doc.log"
          if grep -q '^warning' "$RUNNER_TEMP/doc.log"; then echo "::error::cargo doc warned"; exit 1; fi
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Shell scripts parse
        run: for f in .github/scripts/*.sh; do bash -n "$f"; done

  # The precise filter's tables are what tools/filters/design_precise.py generates, with the
  # hash-pinned NumPy (x86-64 only: the committed tables were made there).
  filter-tables:
    name: precise filter tables
    runs-on: ubuntu-24.04
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest.
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
    defaults:
      run:
        shell: bash
    steps:
      - name: Packages
        run: dnf -y -q --setopt=install_weak_deps=False install git-core python3 python3-pip && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: NumPy (hash-pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes --only-binary=:all: -r tools/filters/requirements.txt
      - name: Generator check
        run: '"$RUNNER_TEMP/venv/bin/python" -I tools/filters/design_precise.py --check'

  # Linux x86_64 and aarch64 (native arm64 runner), in UBI 10.
  test-linux:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: x86_64-linux, runner: ubuntu-24.04}
          - {name: aarch64-linux, runner: ubuntu-24.04-arm}
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest (an index: amd64 and arm64).
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
    defaults:
      run:
        shell: bash
    steps:
      - name: Packages
        run: dnf -y -q --setopt=install_weak_deps=False install git-core gcc && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (.github/scripts/rust-setup.sh)
        run: .github/scripts/rust-setup.sh "$RUST_STABLE"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-ubi10
      - name: Tests at every SIMD level
        run: .github/scripts/test-simd-levels.sh
      - name: Soak test, short (memory levels off, worker threads end; docs/testing.md)
        run: cargo test --locked -p dsd2pcm --test soak -- --ignored --nocapture
        env:
          DSD2PCM_SOAK_ITERATIONS: "1000"

  # 32-bit x86: built for i686-unknown-linux-gnu with gcc -m32 and run natively on the x86_64
  # runner. Fedora, pinned by digest: UBI has no 32-bit C libraries.
  test-i686:
    name: tests (i686-linux)
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora@sha256:b414c09be79dd1f32529b55b096b6bb30435d82ee16fbdbbabf8985eb5f86db0
    defaults:
      run:
        shell: bash
    env:
      TARGET: i686-unknown-linux-gnu
    steps:
      - name: Packages (gcc and the 32-bit glibc, libgcc and libatomic, which gcc -m32 links)
        run: dnf -y -q --setopt=install_weak_deps=False install git-core gcc file glibc-devel.i686 libgcc.i686 libatomic.i686 && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (.github/scripts/rust-setup.sh)
        run: .github/scripts/rust-setup.sh "$RUST_STABLE" "" "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-fedora-i686
      - name: gcc -m32 links
        run: |
          printf 'int main(void) { return 0; }\n' > "$RUNNER_TEMP/m32.c"
          gcc -m32 -o "$RUNNER_TEMP/m32" "$RUNNER_TEMP/m32.c"
          "$RUNNER_TEMP/m32"
      - name: Tests at every SIMD level
        run: .github/scripts/test-simd-levels.sh --target "$TARGET"
      - name: The CLI is a 32-bit x86 program
        run: |
          cargo build --locked -p dsd2pcm-cli --target "$TARGET"
          file "target/$TARGET/debug/dsd2pcm" | tee /dev/stderr | grep -q 'ELF 32-bit.*Intel'

  # macOS arm64 and Windows x86_64, on the runners' own rustup.
  test-other:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: aarch64-macos, runner: macos-15}
          - {name: x86_64-windows, runner: windows-2025}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: |
          rustup toolchain install "$RUST_STABLE" --profile minimal
          rustup default "$RUST_STABLE"
          rustc -vV
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests at every SIMD level
        run: .github/scripts/test-simd-levels.sh

  # The C library (crates/dsd2pcm-capi): the committed header matches cbindgen, compiles as
  # C99 and C11, and C programs link against the static library and run
  # (.github/scripts/capi-check.sh), then again under clang's AddressSanitizer, LeakSanitizer
  # and UndefinedBehaviorSanitizer (tests/leakloop.c: create, convert and free many times).
  # Passes with a notice while the crate does not exist.
  capi:
    name: C library
    runs-on: ubuntu-24.04
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest.
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
    defaults:
      run:
        shell: bash
    steps:
      - name: Packages
        run: dnf -y -q --setopt=install_weak_deps=False install git-core gcc clang compiler-rt python3 diffutils findutils && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (.github/scripts/rust-setup.sh)
        if: hashFiles('crates/dsd2pcm-capi/Cargo.toml') != ''
        run: .github/scripts/rust-setup.sh "$RUST_STABLE"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        if: hashFiles('crates/dsd2pcm-capi/Cargo.toml') != ''
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v0-rust-ubi10-capi
      - name: cbindgen (pinned version, its own lock file)
        if: hashFiles('crates/dsd2pcm-capi/Cargo.toml') != ''
        run: cargo install --locked cbindgen --version "$CBINDGEN_VERSION"
      - name: Header and C tests, also under the sanitizers
        run: .github/scripts/capi-check.sh crates/dsd2pcm-capi
        env:
          ASAN_CC: clang
          LEAKLOOP_ITERATIONS: "100"
