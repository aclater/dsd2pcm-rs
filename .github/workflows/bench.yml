# Speed against scarletbook-pcm 0.7.0 on GitHub-hosted runners, by hand only: Linux aarch64
# (ubuntu-24.04-arm), macOS on Apple silicon (macos-15) and Linux x86_64 (ubuntu-24.04) as a
# sanity row. Each job builds the examples in release, writes a 2-channel and a 6-channel
# test DSF (.github/scripts/make-test-dsf.py --music), runs examples/bench.rs and
# examples/sacdfs_path.rs in rounds with the crate order alternating
# (.github/scripts/bench-rounds.sh), and writes the median ratios to the job summary
# (.github/scripts/bench-summary.py); the raw logs are uploaded. Shared runners: the numbers
# are indicative. The examples assert that both crates give the same bytes, so each job also
# checks identity on its platform.
name: bench

on:
  pull_request:  # TEMPORARY: measurement run before merge; reverted in this PR
  workflow_dispatch:
    inputs:
      rounds:
        description: Rounds per file (crate order alternates)
        type: number
        default: 5
      seconds:
        description: Seconds of audio per file
        type: number
        default: 60

concurrency:
  group: ${{ github.workflow }}  # one benchmark at a time; a queued run waits, nothing is cancelled
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.100.0
  ROUNDS: ${{ inputs.rounds || '5' }}
  SECONDS_OF_AUDIO: ${{ inputs.seconds || '60' }}

jobs:
  # Linux aarch64 and x86_64, in UBI 10 as in ci.yml.
  linux:
    name: bench (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: aarch64-linux, runner: ubuntu-24.04-arm}
          - {name: x86_64-linux, runner: ubuntu-24.04}
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest (an index: amd64 and arm64).
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
    defaults:
      run:
        shell: bash
    steps:
      - name: Packages
        run: dnf -y -q --setopt=install_weak_deps=False install git-core gcc python3 && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (.github/scripts/rust-setup.sh)
        run: .github/scripts/rust-setup.sh "$RUST_STABLE"
      - name: Build the examples (release)
        run: cargo build --release --locked -p dsd2pcm --examples
      - name: Rounds
        run: .github/scripts/bench-rounds.sh "$RUNNER_TEMP/bench/logs" "$ROUNDS" "$SECONDS_OF_AUDIO"
      - name: Summary
        env:
          NAME: ${{ matrix.name }}
        run: |
          python3 -I .github/scripts/bench-summary.py "$RUNNER_TEMP/bench/logs" "$NAME" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: bench-${{ matrix.name }}
          path: ${{ runner.temp }}/bench/logs
          retention-days: 30

  # macOS on Apple silicon, on the runner's own rustup.
  macos:
    name: bench (aarch64-macos)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: |
          rustup toolchain install "$RUST_STABLE" --profile minimal
          rustup default "$RUST_STABLE"
          rustc -vV
      - name: Build the examples (release)
        run: cargo build --release --locked -p dsd2pcm --examples
      - name: Rounds
        run: .github/scripts/bench-rounds.sh "$RUNNER_TEMP/bench/logs" "$ROUNDS" "$SECONDS_OF_AUDIO"
      - name: Summary
        run: |
          python3 -I .github/scripts/bench-summary.py "$RUNNER_TEMP/bench/logs" aarch64-macos | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: bench-aarch64-macos
          path: ${{ runner.temp }}/bench/logs
          retention-days: 30
