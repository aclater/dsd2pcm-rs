# Docs stay true: links resolve, the README's Quick start works on the latest release, and
# the version named in the manifests, lock files, changelog and docs is one version.
# - lint, links, touched, facts, commands: the shared DSD Toolbox docs tools (tools/docs of
#   dsd-toolbox/dsd-toolbox, docs/docs-tooling.md there), as reusable workflows pinned to one
#   commit; the same commit is passed as the tools' ref. Settings in .docs.toml.
#   - lint: page and README shape, spelling, terminology, placeholders, the release step.
#   - links: every Markdown file's relative links, anchors and links into this repository,
#     offline; on the weekly run and by hand also every external URL.
#   - touched (pull requests): a change to code, options or behaviour also changes the docs, or
#     the pull request says "Docs: none needed — <reason>".
#   - facts: the marked facts regions (versions, install lines) equal their sources. Read-only.
#   - commands (weekly and by hand): the marked command blocks of README.md and docs/ run in a
#     fresh container against the published release; the rest are skipped with a reason.
# - external links: lychee (pinned binary, SHA-256 checked) over README.md, CHANGELOG.md,
#   SECURITY.md, PROVENANCE.md, AGENTS.md and docs/, external URLs with retries
#   (.github/lychee.toml), on every run. Kept next to the shared links check because it also
#   checks #fragments on external pages, which the shared tool does not.
# - quick start: the README's Quick start block, run literally (.github/scripts/readme-quick-start.sh),
#   on every pull request; between a version bump and its tag it passes with a notice.
# - versions: .github/scripts/check-doc-versions.py (Cargo.toml, the lock files, CHANGELOG.md,
#   CITATION.cff and the release references in the docs).
# Linux only; no secrets.
name: docs

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 3"  # Wednesdays, 06:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a new push supersedes the old PR run; main runs finish

permissions:
  contents: read

env:
  # lychee from its GitHub release, checked against this hash (the release's .sha256 file).
  LYCHEE_VERSION: 0.24.2
  LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a

jobs:
  # The shared docs tools, pinned to one commit of dsd-toolbox/dsd-toolbox (workflow and tools).
  lint:
    uses: dsd-toolbox/dsd-toolbox/.github/workflows/docs-lint.yml@b50a7cca297022561959ba9a2532c0673d532ada
    with:
      tools_ref: b50a7cca297022561959ba9a2532c0673d532ada

  links:
    uses: dsd-toolbox/dsd-toolbox/.github/workflows/docs-links.yml@b50a7cca297022561959ba9a2532c0673d532ada
    with:
      tools_ref: b50a7cca297022561959ba9a2532c0673d532ada
      external: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  touched:
    if: github.event_name == 'pull_request'
    uses: dsd-toolbox/dsd-toolbox/.github/workflows/docs-touched.yml@b50a7cca297022561959ba9a2532c0673d532ada
    with:
      tools_ref: b50a7cca297022561959ba9a2532c0673d532ada

  facts:
    uses: dsd-toolbox/dsd-toolbox/.github/workflows/docs-facts.yml@b50a7cca297022561959ba9a2532c0673d532ada
    with:
      tools-ref: b50a7cca297022561959ba9a2532c0673d532ada

  # Against the published release, so not on pull requests: between a version bump and its tag
  # the README names a release that does not exist yet (the quick start job handles that window).
  commands:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: dsd-toolbox/dsd-toolbox/.github/workflows/docs-run.yml@b50a7cca297022561959ba9a2532c0673d532ada
    with:
      tools-ref: b50a7cca297022561959ba9a2532c0673d532ada

  external-links:
    name: external links
    runs-on: ubuntu-24.04
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest.
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
    defaults:
      run:
        shell: bash
    steps:
      - name: Packages
        run: dnf -y -q --setopt=install_weak_deps=False install tar gzip && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: lychee (pinned version and SHA-256)
        run: |
          name=lychee-x86_64-unknown-linux-gnu
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v$LYCHEE_VERSION/$name.tar.gz"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/$name.tar.gz"
          install -m 755 "$RUNNER_TEMP/$name/lychee" "$RUNNER_TEMP/lychee"
          "$RUNNER_TEMP/lychee" --version
      - name: External links (with retries)
        run: |
          "$RUNNER_TEMP/lychee" --no-progress --config .github/lychee.toml \
            README.md CHANGELOG.md SECURITY.md PROVENANCE.md AGENTS.md 'docs/**/*.md'

  quick-start:
    name: quick start
    runs-on: ubuntu-24.04
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest.
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
    defaults:
      run:
        shell: bash
    steps:
      - name: Packages
        run: dnf -y -q --setopt=install_weak_deps=False install git-core gawk python3 tar gzip && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The README's Quick start, literally, on the release it names
        run: .github/scripts/readme-quick-start.sh

  versions:
    name: versions
    runs-on: ubuntu-24.04
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest.
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
    defaults:
      run:
        shell: bash
    steps:
      - name: Packages
        run: dnf -y -q --setopt=install_weak_deps=False install python3 && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: One version in manifests, lock files, changelog and docs
        run: python3 -I .github/scripts/check-doc-versions.py
