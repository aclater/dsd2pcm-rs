[workspace]
resolver = "2"
members = ["crates/dsd2pcm", "crates/dsd2pcm-capi", "crates/dsd2pcm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.83"
publish = false

[workspace.dependencies]
dsd2pcm = { path = "crates/dsd2pcm", version = "=0.1.0" }

[profile.release]
codegen-units = 1
lto = "thin"
